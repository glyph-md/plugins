name: Smoke

on:
  push:
    branches: [main]
  pull_request:

# CI-time smoke tests for the scripts that publish this registry: they drive the
# real release script end to end against a throwaway repo whose `gh` is a stub,
# as opposed to validate.yml, which checks the registry data itself. The same
# run checks each official dictionary's word list with the app's spell-check
# engine, the one dependency package-lock.json pins.
permissions:
  contents: read

jobs:
  scripts:
    name: Scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts
      - run: node --test
