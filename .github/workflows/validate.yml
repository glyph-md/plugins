name: Validate registry

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  # npx downloads and runs ajv-cli, so this job holds no write permission. On
  # main, publish-index below commits what the generator produces.
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Validate every plugin registration
        run: |
          set -e
          for dir in plugins/*/; do
            id=$(basename "$dir")
            test -f "$dir/plugin.json" || { echo "$id: missing plugin.json"; exit 1; }
            test -f "$dir/README.md" || { echo "$id: missing README.md (the catalog page)"; exit 1; }
            npx --yes ajv-cli@5.0.0 validate -s plugin.schema.json -d "$dir/plugin.json" --strict=false
          done

      # The registration is what the marketplace publishes; the manifest is what
      # ships inside the release zip. Drift between them fails the PR here
      # instead of the post-merge release job, which no re-run can turn green.
      - name: Check registrations against their manifests
        run: node scripts/check-plugins.mjs

      # Comparing against the base branch would reject a PR that changes the
      # generator itself, since its output legitimately moves with it. Compare
      # against a fresh run instead: hand edits still fail, generator changes
      # pass as long as the committed output was regenerated.
      - name: Check the generated files match the generator
        if: github.event_name == 'pull_request'
        run: |
          node scripts/build-index.mjs
          if ! git diff --quiet -- index.json index docs/plugin-catalog.md; then
            echo "index.json, index/, and docs/plugin-catalog.md are generated from plugins/*/plugin.json."
            echo "What this PR commits does not match what scripts/build-index.mjs produces."
            echo "Do not hand-edit them; change plugins/<id>/plugin.json (or the generator) and rerun:"
            echo "  node scripts/build-index.mjs"
            git diff --stat -- index.json index docs/plugin-catalog.md
            exit 1
          fi

      - name: Generate index.json and the catalog
        run: node scripts/build-index.mjs

      - name: Validate the generated index against its schema
        run: npx --yes ajv-cli@5.0.0 validate -s index.schema.json -d index.json --strict=false

  # Runs only this repo's scripts, which use nothing outside Node's standard
  # library, so the write token never shares a job with a downloaded package.
  publish-index:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Generate index.json and the catalog
        run: node scripts/build-index.mjs

      - name: Commit regenerated files
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- index.json index docs/plugin-catalog.md; then
            echo "generated files already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json index docs/plugin-catalog.md
          git commit -m "chore: regenerate index and catalog"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
