version: 2
updates:
  # Keeps the pinned action SHAs in the workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A release waits a week before it is proposed, and a major version is a
    # deliberate change made by hand.
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore(ci)
